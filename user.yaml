- name: configuring user
  hosts: user
  become: yes
  
  tasks:
  - name: nodejs:20 module enabling
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: installing nodejs 
    ansible.builtin.dnf: 
      name: nodejs
      state: present

  - name: creating roboshop system user
    ansible.builtin.user: 
      name: roboshop
      system: yes
      home: /app
      shell: /sbin/nologin
      comment: roboshop system user

  - name: deleting application directory
    ansible.builtin.file: 
      path: /app
      state: absent

  - name: creating application directory
    ansible.builtin.file: 
      path: /app
      state: directory

  - name: deleting user.zip
    ansible.builtin.file: 
      path: /tmp/user.zip
      state: absent

  - name: downloading user
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip
      dest: /tmp/user.zip

  - name: unarchive the user
    ansible.builtin.unarchive:
      src: /tmp/user.zip
      dest: /app
      remote_src: yes

  - name: installing package dependencies
    community.general.npm: 
      path: /app

  - name: copy the systemd user service
    ansible.builtin.template: 
      src: user.service
      dest: /etc/systemd/system/user.service

  - name: reloading the daemon
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: start and enable the user
    ansible.builtin.service:
      name: user
      enabled: yes
      state: restarted
