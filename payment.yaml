- name: configuring python
  hosts: payment
  become: yes
  tasks:
  - name: installing python and its dependencies
    ansible.builtin.dnf:
      name: "{{ item }}"
      state: present
    loop:
      - python3
      - gcc
      - python3-devel

  - name: creating roboshop system user
    ansible.builtin.user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: roboshop system user

  - name: deleting application directory
    ansible.builtin.file: 
      path: /app
      state: absent

  - name: create application directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: deleting payment.zip
    ansible.builtin.file: 
      path: /tmp/payment.zip
      state: absent

  - name: download the application url
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
      dest: /tmp/payment.zip

  - name: unzip the payment directory
    ansible.builtin.unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes

  - name: installing dependencies
    ansible.builtin.pip:
      requirements: requirements.txt
      executable: pip3.9
    args:
      chdir: /app

  - name: creating payment service
    ansible.builtin.template:
      src: payment.service
      dest: /etc/systemd/system/payment.service

  - name: reloading the systemctl daemon
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: enable and start payment service
    ansible.builtin.service:
      name: payment
      enabled: yes
      state: restarted
