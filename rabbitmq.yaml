- name: configuring rabbitmq server
  hosts: rabbitmq
  become: yes
  tasks:
  - name: coping rabbitmq repository
    ansible.builtin.copy:
      src: rabbitmq.repo
      dest: /etc/yum.repos.d/rabbitmq.repo
  
  - name: installing rabbitmq server
    ansible.builtin.dnf:
      name: rabbitmq-server
      state: present

  - name: enable and start the service
    ansible.builtin.service:
      name: rabbitmq-server
      enabled: yes
      state: restarted

  - name: creating rabbitmq user and setting permissions
    community.rabbitmq.rabbitmq_user:
    user: roboshop
    password: roboshop123
    permissions:
      - vhost: /
        configure_priv: .*
        read_priv: .*
        write_priv: .*
    state: present